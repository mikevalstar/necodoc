<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>necodoc · Drafting · Generations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="../shared/data.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="shell.js"></script>
<style>
.q { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); flex: 1; font: 12px var(--mono); }
.q .tok { display: inline-flex; align-items: center; height: 22px; border-radius: 2px; overflow: hidden; border: 1px solid var(--line-2); }
.q .tok span { padding: 0 6px; height: 100%; display: flex; align-items: center; }
.q .tok span:first-child { background: var(--raised); color: var(--fg-3); border-right: 1px solid var(--line-2); }
.q .tok span:last-child { color: var(--fg); }
.q .caret { width: 1px; height: 16px; background: var(--brand); }
.q .hint { margin-left: auto; color: var(--fg-3); }
.top2 { display: flex; gap: 8px; margin-bottom: 10px; }
.hist { display: grid; grid-template-columns: 1fr 210px; margin-bottom: 10px; }
.hist svg text { font: 10px var(--mono); fill: var(--fg-3); }
.hist .stats { border-left: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font: 12px var(--mono); color: var(--fg-3); align-content: center; }
.hist .stats b { color: var(--fg); font-weight: 500; text-align: right; }
.tbl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
.rb { display: inline-flex; align-items: center; gap: 8px; }
.rb .t { width: 64px; height: 6px; background: var(--sunk); position: relative; border-radius: 1px; }
.rb .t i { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: 1px; }
.rb .t.slow i { background: var(--warn-dot); }
.rb .t::after { content: ""; position: absolute; left: 34%; top: -3px; bottom: -3px; width: 1px; background: var(--fg-3); }
tr.err td { background: var(--bad-wash); }
tr.detail td { height: auto; padding: 8px 10px 10px 42px; background: var(--bad-wash); border-bottom: 1px solid var(--line); white-space: normal; }
.detail pre { margin: 6px 0 0; font: 11.5px/1.5 var(--mono); color: var(--fg-2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.detail .e { color: var(--bad); font: 500 12px var(--mono); }
.pg { display: flex; align-items: center; gap: 10px; margin-top: 8px; font: 11.5px var(--mono); color: var(--fg-3); }
.pg .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
@media (max-width: 1000px) { .app { grid-template-columns: 48px 0 1fr !important; } .tree { display: none; } .cmd { width: 200px; } .crumbs { display: none !important; } .status .r { display: none; } .hide-t { display: none; } .hist { grid-template-columns: 1fr; } .hist .stats { display: none; } }
</style></head>
<body>
<main id="page" class="page">
  <div class="ph"><h1>Generations<span class="id">12,406 in range</span></h1>
    <div class="actions"><button class="btn ghost" style="color:var(--bad)"><i data-lucide="trash-2"></i>Delete matching…</button><button class="btn"><i data-lucide="download"></i>Export CSV</button><button class="btn"><i data-lucide="bookmark"></i>Save view</button></div></div>
  <div class="top2">
    <div class="q" role="search"><i data-lucide="filter"></i>
      <span class="tok"><span>status</span><span>failed, slow</span></span><span class="tok"><span>source</span><span>api, batch</span></span><span class="tok"><span>render</span><span>&gt; 0.5 s</span></span><span class="tok"><span>since</span><span>7 d</span></span><span class="caret"></span>
      <span class="hint">template: key: user: batch: id:</span></div>
    <div class="seg"><span>1 h</span><span>24 h</span><span class="on">7 d</span><span>30 d</span></div>
    <button class="btn ghost" aria-label="Columns"><i data-lucide="columns-3"></i>Columns</button>
  </div>
  <section class="panel hist" aria-label="Render time distribution">
    <svg id="hist" viewBox="0 0 900 96" width="100%" role="img" aria-label="Render time histogram, most renders under one second"></svg>
    <div class="stats"><span>p50</span><b>0.74 s</b><span>p95</span><b style="color:var(--warn)">2.41 s</b><span>p99</span><b>5.80 s</b><span>failed</span><b style="color:var(--bad)">71</b></div>
  </section>
  <div class="tbl"><table class="grid">
    <thead><tr><th class="cb"><span class="cbx"></span></th><th class="sort">Queued ↓</th><th>Status</th><th>File</th><th class="hide-t">Template</th><th>Source</th><th class="n hide-t">Pg</th><th class="n hide-t">Size</th><th class="n">Queue</th><th>Render</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  <div class="pg"><span>1–14 of 12,406</span><span>· 50 / page</span><div class="r"><button class="btn">‹ Newer</button><button class="btn">Older ›</button><span>j/k move · ↵ open · x select</span></div></div>
</main>
<script>
const st = { success: ["ok", "ok"], slow: ["warn", "slow"], failed: ["bad", "fail"], running: ["run", "run"] };
document.getElementById("rows").innerHTML = NECO.generations.map(g => `<tr class="${g.status === "failed" ? "err" : ""}">
  <td class="cb"><span class="cbx"></span></td>
  <td class="m">10-12 ${g.at.slice(0, 12)}</td>
  <td><span class="sc ${st[g.status][0]}">${st[g.status][1]}</span></td>
  <td>${g.file} <span class="m" style="color:var(--fg-3);font-size:11px">${g.id}</span></td>
  <td class="hide-t" style="color:var(--fg-2)">${g.template}</td>
  <td class="m">${g.source.toLowerCase()}${g.key !== "—" ? " · " + g.key : ""}</td>
  <td class="n hide-t">${g.pages ?? "—"}</td><td class="n hide-t">${g.size}</td><td class="n">${fmtS(g.queue)}</td>
  <td>${g.render != null ? `<span class="rb"><span class="n" style="width:52px;display:inline-block">${fmtS(g.render)}</span><span class="t ${g.status === "slow" ? "slow" : ""}"><i style="width:${Math.min(100, g.render / 7 * 100)}%"></i></span></span>` : '<span class="m" style="color:var(--fg-3)">—</span>'}</td>
  <td><button class="ib" aria-label="Open"><i data-lucide="${g.status === "failed" ? "chevron-down" : "chevron-right"}"></i></button></td></tr>` + (g.error ? `<tr class="detail"><td colspan="11"><span class="e">422 · ${g.error}</span> &nbsp; <span class="m" style="color:var(--fg-3)">batch #221 · row 118 · retried 2×</span><pre>{ "dealer_name": "Empire Auto Group", "dealer_facility_no": null, "bond_amount": 100000 }</pre></td></tr>` : "")).join("");
// histogram, log buckets
const b = [3, 18, 64, 92, 71, 40, 22, 13, 9, 6, 5, 4, 3, 2, 2, 1, 1, 1, 0, 1], W = 900, H = 96, L = 12, bw = (W - L * 2) / b.length;
let h = "";
b.forEach((n, i) => { const x = L + i * bw, hh = n / 92 * (H - 30); h += `<rect x="${x + 1}" y="${H - 18 - hh}" width="${bw - 2}" height="${hh}" fill="${i >= 9 ? "var(--warn-dot)" : "var(--brand)"}" opacity="${i >= 3 && i <= 13 ? 1 : .45}"/>`; });
[["0.1 s", 0], ["0.5 s", 3], ["1 s", 5], ["2.4 s p95", 9], ["5 s", 13], ["10 s", 19]].forEach(([t, i]) => h += `<text x="${L + i * bw + 2}" y="${H - 4}">${t}</text>`);
h += `<line x1="${L + 9 * bw}" x2="${L + 9 * bw}" y1="6" y2="${H - 16}" stroke="var(--warn-dot)" stroke-dasharray="3 2"/>`;
h += `<rect x="${L + 3 * bw}" y="4" width="${bw * 11}" height="${H - 20}" fill="var(--brand)" opacity=".06" stroke="var(--brand)" stroke-opacity=".5"/><text x="${L + 14 * bw - 6}" y="16" text-anchor="end" style="fill:var(--brand-text)">render &gt; 0.5 s · 4,118</text>`;
document.getElementById("hist").innerHTML = h;
shell("Generations", '<i data-lucide="chevron-right"></i>Developers<i data-lucide="chevron-right"></i><b>Generations</b>');
</script>
</body></html>
