{{- if .Values.ingress.enabled }}
{{- $name := include "necodoc.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "necodoc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Same origin for the app and the API keeps Better Auth cookies simple.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $name }}-app, port: { name: http } }
{{- end }}
