{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "necodoc.secretName" . }}
  labels:
    {{- include "necodoc.labels" . | nindent 4 }}
  annotations:
    # A hook, so the migration Job (also a pre-install hook) can read it on first install.
    # Consequence: `helm uninstall` leaves it behind (ADR 0025).
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required (or set secrets.existingSecret)" .Values.secrets.DATABASE_URL | quote }}
  BETTER_AUTH_SECRET: {{ required "secrets.BETTER_AUTH_SECRET is required (or set secrets.existingSecret)" .Values.secrets.BETTER_AUTH_SECRET | quote }}
  {{- range $key := list "DOWNLOAD_SIGNING_SECRET" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" "AZURE_STORAGE_CONNECTION_STRING" "AZURE_STORAGE_KEY" }}
  {{- with index $.Values.secrets $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
