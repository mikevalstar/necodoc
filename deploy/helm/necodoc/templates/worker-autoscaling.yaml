{{- $w := .Values.worker -}}
{{- $target := printf "%s-worker" (include "necodoc.fullname" .) -}}
{{- if and $w.autoscaling.enabled $w.keda.enabled }}
{{- fail "worker.autoscaling and worker.keda are exclusive: KEDA manages its own HPA" }}
{{- end }}
{{- if $w.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $target }}
  labels:
    {{- include "necodoc.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $target }} }
  minReplicas: {{ $w.autoscaling.minReplicas }}
  maxReplicas: {{ $w.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $w.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if $w.keda.enabled }}
# Queue depth from pg-boss's job table (as Admin > System's live queue reads it). A pg-boss major
# upgrade may change the table; check this query when upgrading.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $target }}
  labels:
    {{- include "necodoc.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { name: {{ $target }} }
  minReplicaCount: {{ $w.keda.minReplicas }}
  maxReplicaCount: {{ $w.keda.maxReplicas }}
  pollingInterval: {{ $w.keda.pollingInterval }}
  cooldownPeriod: {{ $w.keda.cooldownPeriod }}
  triggers:
    - type: postgresql
      metadata:
        # Resolved from the worker container's env (the Secret).
        connectionFromEnv: DATABASE_URL
        query: "SELECT count(*) FROM pgboss.job WHERE name = 'render' AND state IN ('created', 'retry', 'active')"
        targetQueryValue: {{ $w.keda.jobsPerReplica | quote }}
{{- end }}
