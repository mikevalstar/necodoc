<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" role="img" aria-labelledby="ra-t ra-d" class="ra">
  <title id="ra-t">necodoc reference architecture</title>
  <desc id="ra-d">Core systems, staff and share-link users reach a stateless necodoc API through your load balancer. The API stores templates, logs, the audit log and the job queue in your Postgres, and issues signed links to PDFs in your object storage. Render workers claim jobs from Postgres, render with headless Chromium and write PDFs to storage. Sign-in goes through your identity provider; metrics, traces and logs go to your observability stack. Outside the trust boundary, and optional: webhooks to your endpoints, your e-sign provider integration, and the Anthropic API only when AI is enabled.</desc>
  <style>
    .ra text { font-family: Figtree, system-ui, sans-serif; fill: #0c1233; }
    .ra .t { font-family: "Bricolage Grotesque", Figtree, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
    .ra .m { font-family: "Fragment Mono", ui-monospace, monospace; font-size: 11.5px; fill: #1f50e0; }
    .ra .s { font-size: 13px; fill: #3f4668; }
    .ra .lbl { font-family: "Fragment Mono", ui-monospace, monospace; font-size: 11px; fill: #5b6285; }
    .ra .cap { font-family: "Fragment Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .08em; fill: #1f50e0; }
    .ra .capw { font-family: "Fragment Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .08em; fill: #8a5600; }
    .ra .tag { font-family: "Fragment Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .06em; fill: #5b6285; }
    .ra .ours { fill: #e7eeff; stroke: #2f6bff; stroke-width: 1.5; }
    .ra .ours-b { fill: #f3f6ff; stroke: #9db8ff; stroke-width: 1.2; }
    .ra .yours { fill: #fff; stroke: #c9cee6; stroke-width: 1.5; }
    .ra .caller { fill: #f5f6fb; stroke: #d3d7ea; stroke-width: 1.2; }
    .ra .opt { fill: #fffaf0; stroke: #d9a640; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .ra .ln { fill: none; stroke: #3f4668; stroke-width: 1.5; }
    .ra .ln-o { fill: none; stroke: #b07a12; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ra .tb { fill: none; stroke: #2f6bff; stroke-width: 1.5; stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="ra-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f4668"/></marker>
    <marker id="ra-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b07a12"/></marker>
  </defs>

  <!-- trust boundary -->
  <rect class="tb" x="246" y="14" width="890" height="478" rx="18" fill="#fbfcff"/>
  <text class="cap" x="268" y="42">YOUR CLOUD ACCOUNT OR DATA CENTRE · TRUST BOUNDARY</text>

  <!-- callers -->
  <text class="tag" x="0" y="70">CALLERS</text>
  <rect class="caller" x="0" y="86" width="206" height="104" rx="12"/>
  <text class="t" x="16" y="114">Core &amp; policy systems</text>
  <text class="s" x="16" y="136">Your policy admin</text>
  <text class="s" x="16" y="154">and core systems</text>
  <text class="m" x="16" y="176">/api/v1 · scoped API key</text>
  <rect class="caller" x="0" y="214" width="206" height="96" rx="12"/>
  <text class="t" x="16" y="242">People in the app</text>
  <text class="s" x="16" y="264">Editors, reviewers, admins</text>
  <text class="m" x="16" y="290">SSO session</text>
  <rect class="caller" x="0" y="334" width="206" height="96" rx="12"/>
  <text class="t" x="16" y="362">Share links</text>
  <text class="s" x="16" y="384">Brokers, principals filling a form</text>
  <text class="m" x="16" y="410">expiring signed token</text>

  <!-- load balancer -->
  <rect class="yours" x="274" y="86" width="40" height="344" rx="10"/>
  <text class="lbl" transform="translate(299 258) rotate(-90)" text-anchor="middle">YOUR LOAD BALANCER / INGRESS</text>
  <path class="ln" d="M206 138H272" marker-end="url(#ra-a)"/>
  <path class="ln" d="M206 262H272" marker-end="url(#ra-a)"/>
  <path class="ln" d="M206 382H272" marker-end="url(#ra-a)"/>
  <text class="lbl" x="240" y="130" text-anchor="end">HTTPS</text>

  <!-- API (stacked = N replicas) -->
  <rect class="ours-b" x="372" y="70" width="236" height="148" rx="14"/>
  <rect class="ours-b" x="366" y="76" width="236" height="148" rx="14"/>
  <rect class="ours" x="360" y="82" width="236" height="148" rx="14"/>
  <text class="t" x="378" y="110">necodoc API</text>
  <text class="m" x="378" y="130">ROLE=api · stateless · × N</text>
  <text class="s" x="378" y="156">REST /api/v1 and the web app</text>
  <text class="s" x="378" y="176">Auth, validation, signed links</text>
  <text class="s" x="378" y="196">Enqueues render jobs</text>
  <text class="s" x="378" y="216">Health and readiness endpoints</text>
  <path class="ln" d="M314 156H358" marker-end="url(#ra-a)"/>

  <!-- workers (stacked) -->
  <rect class="ours-b" x="372" y="290" width="236" height="148" rx="14"/>
  <rect class="ours-b" x="366" y="296" width="236" height="148" rx="14"/>
  <rect class="ours" x="360" y="302" width="236" height="148" rx="14"/>
  <text class="t" x="378" y="330">Render workers</text>
  <text class="m" x="378" y="350">ROLE=worker · × N · KEDA</text>
  <text class="s" x="378" y="376">Headless Chromium, pdf-lib</text>
  <text class="s" x="378" y="396">N render slots each</text>
  <text class="s" x="378" y="416">Interactive jobs jump the batch</text>
  <text class="s" x="378" y="436">A crashed job retries elsewhere</text>

  <!-- postgres -->
  <rect class="yours" x="662" y="82" width="232" height="148" rx="14"/>
  <text class="t" x="680" y="110">Postgres</text>
  <text class="m" x="680" y="130">managed or self-run</text>
  <text class="s" x="680" y="156">Templates and versions</text>
  <text class="s" x="680" y="176">Generation log, audit log</text>
  <text class="s" x="680" y="196">Job queue (pg-boss)</text>
  <text class="s" x="680" y="216">Users, keys, settings</text>

  <!-- storage -->
  <rect class="yours" x="662" y="302" width="232" height="148" rx="14"/>
  <text class="t" x="680" y="330">Object storage</text>
  <text class="m" x="680" y="350">S3 · Azure Blob · disk</text>
  <text class="s" x="680" y="376">Generated PDFs and assets</text>
  <text class="s" x="680" y="396">In the region you choose</text>
  <text class="s" x="680" y="416">Downloads via signed links</text>

  <!-- idp -->
  <rect class="yours" x="934" y="82" width="186" height="118" rx="14"/>
  <text class="t" x="952" y="110">Identity provider</text>
  <text class="s" x="952" y="134">Entra ID, Auth0,</text>
  <text class="s" x="952" y="152">SiteMinder, any IdP</text>
  <text class="m" x="952" y="178">OIDC · SAML 2.0</text>

  <!-- observability -->
  <rect class="yours" x="934" y="226" width="186" height="118" rx="14"/>
  <text class="t" x="952" y="254">Observability</text>
  <text class="s" x="952" y="278">Prometheus, OTLP</text>
  <text class="s" x="952" y="296">collector, log shipper</text>
  <text class="m" x="952" y="322">request id end to end</text>

  <!-- api <-> postgres -->
  <path class="ln" d="M610 120H660" marker-start="url(#ra-a)" marker-end="url(#ra-a)"/>
  <text class="lbl" x="616" y="112">SQL</text>
  <!-- api -> storage (signed links) -->
  <path class="ln" d="M610 206H644V318H660" marker-end="url(#ra-a)"/>
  <!-- postgres -> workers (claim jobs) -->
  <path class="ln" d="M660 186H626V340H610" marker-end="url(#ra-a)"/>
  <text class="lbl" transform="translate(638.5 262) rotate(-90)" text-anchor="middle" style="font-size:10px">claim jobs</text>
  <!-- workers -> storage -->
  <path class="ln" d="M610 412H660" marker-end="url(#ra-a)"/>
  <text class="lbl" x="618" y="404">PDF</text>
  <!-- api -> idp -->
  <path class="ln" d="M500 82V58H1000V80" marker-end="url(#ra-a)"/>
  <text class="lbl" x="760" y="52">OIDC / SAML sign-in</text>
  <!-- telemetry bus -->
  <path class="ln" d="M540 452V472H912V300H932" marker-end="url(#ra-a)"/>
  <text class="lbl" x="556" y="466">metrics · traces · JSON logs from every process</text>

  <!-- outbound, optional -->
  <text class="capw" x="0" y="566">OPTIONAL · OUTBOUND</text>
  <text class="lbl" x="0" y="586">off until you configure it</text>
  <rect class="opt" x="360" y="540" width="236" height="92" rx="12"/>
  <text class="t" x="376" y="568">Webhooks</text>
  <text class="s" x="376" y="590">To your endpoints, HMAC-SHA256</text>
  <text class="s" x="376" y="608">signed, 5 retries with backoff</text>
  <rect class="opt" x="662" y="540" width="232" height="92" rx="12"/>
  <text class="t" x="678" y="568">E-sign provider</text>
  <text class="s" x="678" y="590">Your DocuSign, Dropbox Sign or</text>
  <text class="s" x="678" y="608">Acrobat Sign integration</text>
  <rect class="opt" x="934" y="540" width="186" height="92" rx="12"/>
  <text class="t" x="950" y="568">Anthropic API</text>
  <text class="s" x="950" y="590">Only if ANTHROPIC_KEY</text>
  <text class="s" x="950" y="608">is set. Off by default.</text>
  <path class="ln-o" d="M420 452V538" marker-end="url(#ra-ao)"/>
  <path class="ln-o" d="M778 494V538" marker-end="url(#ra-ao)"/>
  <circle cx="778" cy="492" r="3" fill="#b07a12"/>
  <text class="lbl" x="770" y="516" text-anchor="end">signing package, via your code</text>
  <path class="ln-o" d="M1027 494V538" marker-end="url(#ra-ao)"/>
  <circle cx="1027" cy="492" r="3" fill="#b07a12"/>
  <text class="lbl" x="1019" y="516" text-anchor="end">AI assist, field detection</text>
</svg>
