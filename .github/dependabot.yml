# Weekly dependency updates, grouped so a week is a handful of PRs rather than dozens.
# cooldown: pnpm refuses packages younger than its minimumReleaseAge (pnpm-workspace.yaml), so
# Dependabot waits a few days before proposing a release. Transitive dependencies it re-resolves
# can still be too new; re-run CI the next day if `pnpm install` fails with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @types/node follows the Node major we run (.nvmrc, Dockerfile). Bump both together.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # apps/web and apps/devdocs stay on TS 6 because astro check doesn't support TS 7 yet
      # (ADR 0010). Remove this once it does. Until then it also holds back TS 8 everywhere.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Only here to satisfy hono-openapi's peers. Follow its range (^0.3.x) rather than run ahead.
      - dependency-name: "@standard-community/standard-json"
        versions: [">=0.4"]
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
